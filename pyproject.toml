[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-mandelbrot"
version = "0.1.0"
description = "Richards Mandelbrot-Programme von 1991, neu aufgebaut in Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
